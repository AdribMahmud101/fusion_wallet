[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "out" }, { access = "read", path = "../../spec/vectors" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/", "safe/=lib/safe-smart-account/contracts/"]
additional_compiler_profiles = [{ name = "safe-legacy", via_ir = false }]
compilation_restrictions = [{ paths = "test/SafeArtifacts.sol", via_ir = false }, { paths = "lib/safe-smart-account/contracts/Safe.sol", via_ir = false }, { paths = "src/**", via_ir = true }]
fuzz = { runs = 1000, seed = "0x20261019" }
invariant = { runs = 64, depth = 32, fail_on_revert = true }

[profile.ci]
fuzz = { runs = 10000, seed = "0x20261019" }
invariant = { runs = 256, depth = 64, fail_on_revert = true }
