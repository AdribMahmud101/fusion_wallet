[package]
name = "fusion-android-core"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
fusion-core = { path = "../../../fusion-core" }
uniffi = "0.32.2"
serde_json = "1"
alloy = { version = "2.5", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
